[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosonar"
version = "0.1.0"
description = "Drone detection using audio analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "torch",
    "torchaudio",
    "pandas",
    "tqdm",
    # training, the verification & evaluation suite, and utils/audit.py
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "soundfile",
    "librosa",
]

[project.optional-dependencies]
# Live microphone capture and the map UI. Not needed to preprocess, train, or run the
# verification & evaluation suite, so they stay out of the base install.
live = [
    "sounddevice",
    "streamlit",
    "pydeck",
]

# This automatically finds your package inside "src"
[tool.setuptools.packages.find]
where = ["src"]

# This tells Python to include the YAML files inside the wheel
[tool.setuptools.package-data]
"aerosonar" = ["config/*.yaml"]